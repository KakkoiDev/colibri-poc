name: Deploy GLM performance page

on:
  push:
    branches: [main]
    paths: ['site/**', 'published-results/glm-bench-*/summary.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the quality bench summary when it has been published
        run: |
          if [ -f published-results/glm-bench-v1/summary.json ]; then
            cp published-results/glm-bench-v1/summary.json site/data/bench-summary.json
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
