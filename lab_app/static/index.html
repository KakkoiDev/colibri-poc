<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLM lab</title>
<link rel="stylesheet" href="lab.css">
</head>
<body class="lab" data-theme="auto">
<div class="app">
  <aside class="side" aria-label="Lab sections">
    <div class="brand">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" style="fill:none;stroke:var(--fg);stroke-width:2px;stroke-linecap:round;stroke-linejoin:round"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg>
      <div style="display:flex;flex-direction:column"><strong style="font-size:15px;line-height:18px">GLM lab</strong><span class="hint">M6 · 32 GB · local</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <span class="chip st-waiting" id="gpu-chip">checking…</span>
      <span class="hint" id="gpu-detail"></span>
      <label class="hint" style="display:flex;gap:6px;align-items:center">Theme
        <select class="input" id="theme" style="width:auto;min-height:28px;padding:2px 6px;font-size:12px" aria-label="Theme">
          <option value="auto">auto</option><option value="light">light</option><option value="dark">dark</option>
        </select>
      </label>
      <span class="hint mono" style="font-size:11px">127.0.0.1 · local only</span>
    </div>
  </aside>
  <main id="main" tabindex="-1"><p class="muted">Loading…</p></main>
</div>
<script src="app.js"></script>
</body>
</html>
